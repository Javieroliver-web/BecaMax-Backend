name: Tests

# Pasa los tests en cada subida y en cada pull request. Gratis dentro de los
# minutos incluidos de GitHub Actions para repos privados.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: ningún paquete ejecuta código al instalarse.
      - run: npm ci --ignore-scripts
      - run: npm test
